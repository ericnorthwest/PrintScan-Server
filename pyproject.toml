[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "printscan-server"
version = "0.2.0"
description = "Authenticated local-network scanner with live browser preview"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "Pillow>=11,<13",
]

[project.scripts]
printscan = "printscan_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/printscan_server"]
