[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "printscan-server"
version = "0.1.0"
description = "Local-network web and IPP print/scan server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
]

[project.scripts]
printscan = "printscan_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/printscan_server"]
